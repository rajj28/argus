{% extends "base.html" %}
{% block title %}Live map{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 data-js="page-heading">Live map</h1>
    <p class="page-subtitle">Real-time fleet positions · Pune operations area</p>
  </div>
</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start;">
  <canvas id="fleet-map" data-js="fleet-map" width="880" height="520"
          style="width:100%;max-width:880px;border-radius:12px;border:1px solid var(--border,#2a3140);background:#0d1520;cursor:crosshair"
          aria-label="Fleet map (canvas)"></canvas>
  <aside class="card" style="padding:16px;">
    <h2 class="section-title" style="margin-top:0">Selection</h2>
    <p data-js="map-selection" role="status" aria-live="polite">No drone selected</p>
    <p class="form-hint">Click a drone marker on the map.</p>
  </aside>
</div>
<script>
(function () {
  const markers = {{ markers | tojson }};
  const view = {{ view | tojson }};
  const canvas = document.querySelector('[data-js="fleet-map"]');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const colors = {"Idle": "#3ddc84", "In mission": "#4da3ff", "Charging": "#f5b841", "Maintenance": "#b48cff"};
  function toScreen(m) {
    return [(m.x * W - W / 2) * view.zoom + W / 2 + view.dx, (m.y * H - H / 2) * view.zoom + H / 2 + view.dy];
  }
  function draw() {
    ctx.fillStyle = '#0d1520'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2 + view.dx, H / 2 + view.dy); ctx.scale(view.zoom, view.zoom); ctx.translate(-W / 2, -H / 2);
    ctx.strokeStyle = 'rgba(120,150,190,0.12)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(77,163,255,0.35)'; ctx.lineWidth = 6; ctx.beginPath();
    ctx.moveTo(0, H * 0.55); ctx.bezierCurveTo(W * 0.3, H * 0.4, W * 0.55, H * 0.8, W, H * 0.62); ctx.stroke();
    ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(245,184,65,0.7)'; ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.1, H * 0.15, W * 0.8, H * 0.72); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(245,184,65,0.8)'; ctx.font = '12px sans-serif'; ctx.fillText('GEOFENCE · 120 m AGL', W * 0.1 + 6, H * 0.15 - 6);
    ctx.restore();
    for (const m of markers) {
      const [sx, sy] = toScreen(m);
      ctx.save(); ctx.translate(sx, sy);
      ctx.fillStyle = colors[m.status] || '#ccc';
      ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(9, 8); ctx.lineTo(0, 4); ctx.lineTo(-9, 8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#0d1520'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#e6edf6'; ctx.font = '600 12px sans-serif'; ctx.fillText(m.name, 12, 4);
      ctx.fillStyle = '#8b98ab'; ctx.font = '11px sans-serif'; ctx.fillText(m.battery + '%', 12, 18);
      ctx.restore();
    }
  }
  canvas.addEventListener('click', function (ev) {
    const r = canvas.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width), py = (ev.clientY - r.top) * (H / r.height);
    let best = null, bd = 1e9;
    for (const m of markers) { const [sx, sy] = toScreen(m); const d = Math.hypot(sx - px, sy - py); if (d < bd) { bd = d; best = m; } }
    const out = document.querySelector('[data-js="map-selection"]');
    if (best && bd <= 18) {
      out.textContent = 'Selected drone: ' + best.name + ' · ' + best.battery + '% · ' + best.status;
      window.lastHit = best.id;
    } else { out.textContent = 'No drone selected'; window.lastHit = null; }
  });
  draw();
})();
</script>
{% endblock %}
