<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
</head>
<body>
  <h1>Sign in</h1>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" name="username" type="text">
    <label for="p">Password</label>
    <input id="p" name="password" type="password">
    <button type="submit">Log in</button>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      sessionStorage.setItem("auth_token", "tok-123");
      document.body.innerHTML = "<h1>Dashboard</h1><p>Welcome, front desk.</p>";
    });
  </script>
</body>
</html>
