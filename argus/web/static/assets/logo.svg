<svg xmlns="http://www.w3.org/2000/svg" width="132" height="32" viewBox="0 0 132 32" role="img" aria-label="Argus">
  <!-- 8px status-light square: ink when idle (set fill to #1F4DFF when a run is live) -->
  <rect class="light" x="2" y="12" width="8" height="8" rx="2" fill="#0B0D12"/>
  <text x="18" y="23" font-family="Schibsted Grotesk, Geist, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="22" font-weight="650" letter-spacing="-0.4" fill="#0B0D12">Argus</text>
</svg>
